# The integration suite runs against real activity implementations, and each of those sleeps
# 1-2.5s to make the demo legible. A payout is therefore ~10s of mostly-idle waiting, and the
# cases are independent: distinct workflow ids, distinct payout ids, one shared Spring context.
#
# Classes stay sequential (one Spring context at a time); a class opts its methods into
# concurrency with @Execution(CONCURRENT).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=6
