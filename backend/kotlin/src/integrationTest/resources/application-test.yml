# Integration-test profile: the full Spring context against the SDK's in-memory test server
# rather than a dev server on 7233.
#
# `connection.target` from application.yml is left as it is. ServiceStubsTemplate prefers the
# test-environment adapter whenever one exists, so the 127.0.0.1:7233 setting is never
# consulted and the suite cannot reach live state.
spring:
  temporal:
    test-server:
      enabled: true
    # application.yml defaults this to false, since the demo runs its workers as separate
    # JVMs. Here the worker runs in-process: the test server lives in this JVM's memory.
    start-workers: true

logging:
  level:
    io.temporal: WARN
    com.example.payouts: WARN
