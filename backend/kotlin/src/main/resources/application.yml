spring:
  application:
    name: payout-demo
  main:
    # TemporalConfig declares its own `temporalMetricsScope` to control the Tally report
    # interval; without this the starter's MetricsScopeAutoConfiguration bean of the same
    # name collides and the context fails to start.
    allow-bean-definition-overriding: true
  temporal:
    connection:
      # NOT `local`. The starter's ServiceStubsTemplate special-cases that value and calls
      # WorkflowServiceStubs.newLocalServiceStubs(), which silently discards the metrics
      # scope AND the stub customizers. Spelling the address out takes the default branch,
      # which applies both -- this is the difference between having SDK metrics and not.
      target: 127.0.0.1:7233
    namespace: default
    # The primary process is the API only. Workers run as separate JVMs that it
    # supervises, so one can be killed and restarted on demand without taking the
    # API -- and therefore the restart button -- down with it.
    start-workers: ${DEMO_START_WORKERS:false}
    workers-auto-discovery:
      # `packages` is deprecated since SDK 1.35.0 and throws if mixed with these.
      workflow-packages:
        - com.example.payouts.workflow
      register-activity-beans: true
    workers:
      - task-queue: payouts
        name: payout-worker
        # Set explicitly, not because the defaults are wrong, but because the high-load
        # preset is ~175 activity executions/sec against a single worker on a developer
        # machine -- the limits should be visible rather than implied.
        capacity:
          max-concurrent-workflow-task-executors: 200
          max-concurrent-activity-executors: 200
          # Pollers autoscale rather than sitting at a fixed count. 50 is the CEILING under
          # backlog, not a constant: idle workers hold 1-2 long polls instead of 100.
          #
          # Raised from 20 because dispatch was measured to scale linearly with poller count at
          # a fixed per-delivery cost -- scaling 10 workers down to 4 cut activity pollers
          # 200 -> 80 and dispatch 114 -> 59/s. Pollers are the dial that moves task delivery
          # here; executor slots are 82-87% idle and are not.
          #
          # These are mutually exclusive with max-concurrent-workflow-task-pollers /
          # max-concurrent-activity-task-pollers -- setting both fails context startup at the
          # `temporalWorkers` bean with "workflowTaskPollersBehavior and
          # maxConcurrentWorkflowTaskPollers are mutually exclusive"
          # (WorkerOptions.validateAndBuildWithDefaults, verified on SDK 1.38.0). So the fixed
          # counts are deleted, not commented out.
          #
          # min for workflow tasks cannot be 1: pollers alternate between the sticky and
          # non-sticky queues, and the SDK silently raises 1 to 2.
          workflow-task-pollers-configuration:
            poller-behavior-autoscaling:
              enabled: true
              min-concurrent-task-pollers: 2
              max-concurrent-task-pollers: 50
          activity-task-pollers-configuration:
            poller-behavior-autoscaling:
              enabled: true
              min-concurrent-task-pollers: 1
              max-concurrent-task-pollers: 50
        rate-limits:
          max-worker-activities-per-second: 300

server:
  port: 8081
  # Caddy's catch-all belongs to Temporal, so Spring must stay inside the demo namespace.
  error:
    path: /demo-api/error

management:
  endpoints:
    web:
      base-path: /demo-api/actuator
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      access: unrestricted

logging:
  level:
    root: INFO
    com.example.payouts: INFO
    io.temporal: WARN
