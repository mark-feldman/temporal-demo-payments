global:
  # 10s: the Metrics tab's panels are read against this interval.
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Temporal server metrics -- `temporal server start-dev --metrics-port 8000`.
  # The flag defaults to a random free port, so it must be set explicitly.
  - job_name: temporal-server
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels: { group: server-metrics }

  # Worker SDK metrics and business metrics, both on the Spring actuator endpoint.
  # The Temporal Spring Boot starter auto-wires its Tally scope to the Micrometer
  # registry whenever spring-boot-starter-actuator is present, so temporal_* SDK
  # metrics land here alongside the payout_* counters -- one scrape, not two.
  #
  # :8081 is the primary (the API). The workers are :8091 upwards -- WorkerSupervisor
  # allocates `basePort + id - 1` from basePort 8091, so worker N always lands on
  # 8090 + N.
  #
  # The list covers every port the fleet can reach: 8091-8100 is WorkerSupervisor.BASE_PORT
  # through BASE_PORT + MAX_WORKERS - 1. An unscraped worker still runs, but nothing about it
  # is observable. `PrometheusTargetsTest` fails if the two files stop agreeing.
  - job_name: payout-demo-worker
    metrics_path: /demo-api/actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels: { group: business-metrics, role: api }
      # Worker JVMs, spawned and supervised by the API. A target is down whenever the fleet is
      # scaled below that number.
      - targets:
          - 'host.docker.internal:8091'
          - 'host.docker.internal:8092'
          - 'host.docker.internal:8093'
          - 'host.docker.internal:8094'
          - 'host.docker.internal:8095'
          - 'host.docker.internal:8096'
          - 'host.docker.internal:8097'
          - 'host.docker.internal:8098'
          - 'host.docker.internal:8099'
          - 'host.docker.internal:8100'
        labels: { group: sdk-metrics, role: worker }
