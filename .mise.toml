# Tool versions for this project. mise is the convenient way to get them, not the only one:
# the Makefile discovers any JDK 21 (scripts/java-home.sh) and scripts/temporal-bin.sh falls
# back to the CLI on PATH.
#
# JDK 21, not the machine default: Kotlin 2.4.20 and Spring Boot are not verified against a
# JDK this new, and 21 is the floor for the Temporal SDK's virtual-thread support. Gradle
# fixes the same version independently via `kotlin { jvmToolchain(21) }`.

[tools]
java = "temurin-21"

# The CLI version decides the bundled Server and Web UI versions, so it is pinned exactly.
# `make start` reads this pin and refuses to run on a different version; `make preflight`
# reports which one it resolved.
"github:temporalio/cli" = { version = "v1.8.3", exe = "temporal" }
