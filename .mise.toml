# Pin the JVM for this project.
#
# The machine default is JDK 26 (`java -version` reports 26.0.1, Homebrew's Maven
# runs 26.0.2.1). Kotlin 2.4.20 + Spring Boot on a JDK that new is an unnecessary
# bet, and JDK 21 is also the floor for the Temporal SDK's virtual-thread support.
#
# Gradle enforces the same choice independently via `kotlin { jvmToolchain(21) }`,
# so a bare ./gradlew cannot pick up 26 even outside a mise shell.

[tools]
java = "temurin-21"

# Pin the Temporal CLI too, and for the same reason as the JDK: two are installed on this
# machine (mise has v1.6.1, Homebrew has 1.8.3) and which one `make start` gets depends
# purely on PATH ordering. That silently changes the bundled Server and Web UI versions --
# 2.45.3 has no top-level Workers view, 2.50.1 does -- so the demo would look different
# depending on which shell it was launched from.
"github:temporalio/cli" = { version = "v1.8.3", exe = "temporal" }
